name: Farm Loop V4 Core

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  GODOT_VERSION: "4.7.2"

jobs:
  circulation-core:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: ${{ env.GODOT_VERSION }}
          use-dotnet: false
          include-templates: false
      - name: Verify Godot
        run: godot --version
      - name: Import scripts
        run: godot --headless --path . --import
      - name: M1 circulation rules
        run: timeout 30s godot --headless --path . --script tests/test_circulation_rules_v4.gd
      - name: M2 save and migration
        run: timeout 30s godot --headless --path . --script tests/test_save_contract_b2.gd
      - name: M3-M4 zone selection and intervention tray
        run: timeout 30s godot --headless --path . --script tests/test_circulation_ui_v4.gd
