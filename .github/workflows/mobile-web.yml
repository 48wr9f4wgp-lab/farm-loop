name: Farm Loop Mobile Web
# smartphone-ci-pages-v4

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pages: write
  id-token: write

concurrency:
  group: farm-loop-mobile-web
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.7.2"

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Report CI start
        uses: actions/github-script@v8
        with:
          script: |
            const title = 'Farm Loop smartphone CI status';
            const body = [
              'Farm Loop Godot v0.3.2 CI: **running**',
              `Commit: ${context.sha}`,
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            ].join('\n');
            const { data: issues } = await github.rest.issues.listForRepo({owner: context.repo.owner, repo: context.repo.repo, state: 'all', per_page: 100});
            const existing = issues.find(i => i.title === title && !i.pull_request);
            if (existing) {
              await github.rest.issues.update({owner: context.repo.owner, repo: context.repo.repo, issue_number: existing.number, body, state: 'open'});
            } else {
              await github.rest.issues.create({owner: context.repo.owner, repo: context.repo.repo, title, body});
            }

      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: ${{ env.GODOT_VERSION }}
          use-dotnet: false
          include-templates: true

      - name: Verify Godot
        run: godot --version

      - name: Import and validate scripts
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . --import 2>&1 | tee import.log
          if grep -E "SCRIPT ERROR|Parse Error|Compile Error|Failed to load script" import.log; then
            echo "Godot import reported script errors"
            exit 1
          fi
          godot --headless --path . --editor --quit 2>&1 | tee parse.log
          if grep -E "SCRIPT ERROR|Parse Error|Compile Error|Failed to load script" parse.log; then
            echo "Godot parse gate failed"
            exit 1
          fi

      - name: Core loop tests
        run: timeout 30s godot --headless --path . --script tests/test_game_rules.gd

      - name: Boot and UI smoke tests
        run: timeout 30s godot --headless --path . --script tests/boot_smoke.gd

      - name: Export Web build
        run: |
          rm -rf build/web
          mkdir -p build/web
          godot --headless --path . --export-release "Web" build/web/index.html
          test -s build/web/index.html
          test -s build/web/index.wasm
          test -s build/web/index.pck

      - name: Web artifact manifest
        run: |
          python3 ci/build_manifest.py build/web > build/web/build_manifest.json
          cat build/web/build_manifest.json

      - name: Upload testable Web artifact
        uses: actions/upload-artifact@v4
        with:
          name: farm-loop-web
          path: build/web
          if-no-files-found: error

      - name: Report build status
        if: always()
        uses: actions/github-script@v8
        with:
          script: |
            const title = 'Farm Loop smartphone CI status';
            const status = '${{ job.status }}';
            const body = [
              `Farm Loop Godot v0.3.2 build: **${status}**`,
              `Commit: ${context.sha}`,
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            ].join('\n');
            const { data: issues } = await github.rest.issues.listForRepo({owner: context.repo.owner, repo: context.repo.repo, state: 'all', per_page: 100});
            const existing = issues.find(i => i.title === title && !i.pull_request);
            const state = status === 'success' ? 'closed' : 'open';
            if (existing) {
              await github.rest.issues.update({owner: context.repo.owner, repo: context.repo.repo, issue_number: existing.number, body, state});
            } else {
              await github.rest.issues.create({owner: context.repo.owner, repo: context.repo.repo, title, body});
            }

  deploy-pages:
    needs: build-test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download validated Web build
        uses: actions/download-artifact@v4
        with:
          name: farm-loop-web
          path: build/web

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: build/web

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Report Pages status
        if: always()
        uses: actions/github-script@v8
        with:
          script: |
            const title = 'Farm Loop smartphone CI status';
            const status = '${{ job.status }}';
            const pageUrl = '${{ steps.deployment.outputs.page_url }}';
            const body = [
              `Farm Loop Godot v0.3.2 Web deploy: **${status}**`,
              `Commit: ${context.sha}`,
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              pageUrl ? `Safari preview: ${pageUrl}` : 'Safari preview: not deployed'
            ].join('\n');
            const { data: issues } = await github.rest.issues.listForRepo({owner: context.repo.owner, repo: context.repo.repo, state: 'all', per_page: 100});
            const existing = issues.find(i => i.title === title && !i.pull_request);
            const state = status === 'success' ? 'closed' : 'open';
            if (existing) {
              await github.rest.issues.update({owner: context.repo.owner, repo: context.repo.repo, issue_number: existing.number, body, state});
            } else {
              await github.rest.issues.create({owner: context.repo.owner, repo: context.repo.repo, title, body});
            }
