name: Farm Loop Mobile Web
# smartphone-ci-observable-v2

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: farm-loop-mobile-web
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.7.2"

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Report CI start
        uses: actions/github-script@v8
        with:
          script: |
            const title = 'Farm Loop smartphone CI status';
            const body = [
              'Farm Loop Godot v0.3.2 CI: **running**',
              `Commit: ${context.sha}`,
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            ].join('\n');
            const { data: issues } = await github.rest.issues.listForRepo({owner: context.repo.owner, repo: context.repo.repo, state: 'all', per_page: 100});
            const existing = issues.find(i => i.title === title && !i.pull_request);
            if (existing) {
              await github.rest.issues.update({owner: context.repo.owner, repo: context.repo.repo, issue_number: existing.number, body, state: 'open'});
            } else {
              await github.rest.issues.create({owner: context.repo.owner, repo: context.repo.repo, title, body});
            }

      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: ${{ env.GODOT_VERSION }}
          use-dotnet: false
          include-templates: true

      - name: Verify Godot
        run: godot --version

      - name: Import resources
        run: godot --headless --path . --import

      - name: Parse main scene and scripts
        run: godot --headless --path . --editor --quit

      - name: Core loop tests
        run: timeout 30s godot --headless --path . --quit-after 2 --script tests/test_game_rules.gd

      - name: Boot and UI smoke tests
        run: timeout 30s godot --headless --path . --quit-after 120 --script tests/boot_smoke.gd

      - name: Export Web build
        run: |
          rm -rf build/web
          mkdir -p build/web
          godot --headless --path . --export-release "Web" build/web/index.html
          test -s build/web/index.html
          test -s build/web/index.wasm
          test -s build/web/index.pck

      - name: Web artifact manifest
        run: |
          python3 ci/build_manifest.py build/web > build/web/build_manifest.json
          cat build/web/build_manifest.json

      - name: Upload testable Web artifact
        uses: actions/upload-artifact@v4
        with:
          name: farm-loop-web
          path: build/web
          if-no-files-found: error

      - name: Report CI status
        if: always()
        uses: actions/github-script@v8
        with:
          script: |
            const title = 'Farm Loop smartphone CI status';
            const status = '${{ job.status }}';
            const body = [
              `Farm Loop Godot v0.3.2 CI: **${status}**`,
              `Commit: ${context.sha}`,
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            ].join('\n');
            const { data: issues } = await github.rest.issues.listForRepo({owner: context.repo.owner, repo: context.repo.repo, state: 'all', per_page: 100});
            const existing = issues.find(i => i.title === title && !i.pull_request);
            const state = status === 'success' ? 'closed' : 'open';
            if (existing) {
              await github.rest.issues.update({owner: context.repo.owner, repo: context.repo.repo, issue_number: existing.number, body, state});
            } else {
              await github.rest.issues.create({owner: context.repo.owner, repo: context.repo.repo, title, body});
            }
